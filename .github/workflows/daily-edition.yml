name: Daily Edition

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  daily-edition:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dagelijkse editie uitvoeren
        run: python scripts/update/content.py
          echo "FINANCIEEL DAGBLAD WINN"
          echo "Dagelijkse workflow werkt."
          date

      - name: Workflow gereed
        run: echo "Test succesvol uitgevoerd."un python scripts /update/content.py
        
