name: Daily Edition

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  daily-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dagelijkse editie uitvoeren
        run: python scripts/update/content.py
      - name: Wijzigingen publiceren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/editions.json
          git commit -m "Automatische dagelijkse editie" || echo "Geen wijzigingen"
          git push

