name: Daily Edition

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  daily-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Publicatie controleren
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/homepage.cjs
          node tests/pricing.cjs
          node tests/publication.cjs
      - name: Dagelijkse editie uitvoeren
        run: python scripts/update/content.py
      - name: Website bouwen zonder externe database
        run: python scripts/build_site.py
      - name: Editie opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/editions.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatische dagelijkse editie"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v4
